
{% load static %}
{% block content %}
    {% include "base/navbar.html" %}

    <div class="container">
        <div class="form-box">

            <h2 style="margin-top:10px;" >Delete Phone</h2>
            <h3 style="margin-top:10px;">{{ phone.phone_name }}</h3>

            <p  style="margin-top:10px;">Brand: {{ phone.brand }}</p>
            <p  style="margin-top:10px;">Price: ₹{{ phone.price }}</p>
            <p  style="margin-top:10px;">Quantity: {{ phone.quantity }}</p>

            {% if phone.image %}
                <img src="{{ phone.image.url }}"
                     width="150"  style="margin-top:10px;"
                     alt="{{ phone.phone_name }}">
            {% endif %}

            <form method="POST">
                {% csrf_token %}

          <button type="submit"
        class="btn btn-delete"
        style="margin-top:10px;"
        onclick="return confirm('Are you sure you want to delete this phone?')">
    Yes, Delete
</button>

                <a href="{% url 'home' %}" class="btn">
                    Cancel
                </a>
              </form>
        </div>
    </div>
    {% include "base/footer.html" %}
{% endblock %}
